<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <title>総会受付フォーム</title>
  <style>
    :root {
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --soft: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; background: #fff; }
    body {
      background: #fff;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      line-height: 1.5;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(env(safe-area-inset-top), 24px)
        max(env(safe-area-inset-right), 20px)
        max(env(safe-area-inset-bottom), 24px)
        max(env(safe-area-inset-left), 20px);
      display: flex;
      flex-direction: column;
    }

    h1 {
      margin: 8px 0 28px;
      font-size: 32px;
      font-weight: 900;
      text-align: center;
      letter-spacing: .06em;
      line-height: 1.25;
    }

    form { display: flex; flex-direction: column; flex: 1; }

    label, .label-like {
      display: block;
      margin: 22px 0 8px;
      font-size: 18px;
      font-weight: 900;
    }
    .first { margin-top: 0; }
    .req { color: #ef4444; }

    .field {
      display: block;
      width: 100%;
      height: 60px;
      padding: 0 16px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: var(--soft);
      color: var(--ink);
      font: inherit;
      font-size: 18px;   /* 16px未満だとiPhoneで入力時に画面が拡大される */
      font-weight: 700;
      appearance: none;
      -webkit-appearance: none;
    }
    .field:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(37,99,235,.18); }
    .field::placeholder { color: #94a3b8; font-weight: 600; }

    .select { position: relative; }
    .select-btn {
      text-align: left;
      padding-right: 44px;
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      touch-action: manipulation;
    }
    .select-btn.empty { color: #94a3b8; font-weight: 600; }
    .select::after {
      content: '▼';
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      pointer-events: none;
    }

    .spacer { flex: 1; min-height: 32px; }

    .submit {
      width: 100%;
      height: 68px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: #fff;
      font: inherit;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .1em;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37,99,235,.4);
      transition: transform .15s;
      touch-action: manipulation;
    }
    .submit:active { transform: scale(.97); }
    .submit:disabled { opacity: .6; transform: none; cursor: default; }

    .error {
      margin-top: 20px;
      padding: 16px;
      background: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 12px;
      color: #991b1b;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.7;
      text-align: center;
    }

    /* ===== 結果 ===== */
    .result {
      padding: 28px 20px;
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 3px solid var(--accent);
      border-radius: 18px;
    }
    .result .label {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .1em;
      text-align: center;
    }
    .result .value {
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 900;
      text-align: center;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .payment {
      margin: 0 0 20px;
      padding: 14px;
      background: #fee2e2;
      border: 2px solid #ef4444;
      border-radius: 12px;
      color: #991b1b;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.6;
      text-align: center;
      animation: pulse 2s ease-in-out infinite;
    }
    .seat {
      margin: 8px 0 24px;
      font-size: 72px;
      font-weight: 900;
      text-align: center;
      color: var(--accent);
      letter-spacing: .06em;
      line-height: 1.05;
      text-shadow: 0 4px 16px rgba(37,99,235,.3);
      animation: popIn .5s cubic-bezier(.68, -.55, .265, 1.55);
    }
    .link a {
      display: block;
      margin-bottom: 16px;
      padding: 16px;
      background: var(--accent);
      border-radius: 12px;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(37,99,235,.35);
    }
    .note {
      padding: 16px;
      background: #fff;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.8;
      text-align: center;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    @keyframes popIn { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .payment, .seat { animation: none; } }

    /* ===== 会社名の選択（全画面） ===== */
    .picker {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      flex-direction: column;
      background: #fff;
    }
    .picker.show { display: flex; }
    .picker-head {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: max(env(safe-area-inset-top), 14px) 16px 14px;
      border-bottom: 2px solid #e2e8f0;
      font-size: 18px;
      font-weight: 900;
    }
    .picker-close {
      flex: none;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      background: #e2e8f0;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      font-weight: 900;
      touch-action: manipulation;
    }
    .picker-search {
      flex: none;
      margin: 12px 16px;
      width: auto;
      height: 52px;
    }
    .picker-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      border-top: 2px solid #e2e8f0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .item {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border: 0;
      border-bottom: 1px solid #e2e8f0;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }
    .item:active { background: #e0f2fe; }
    .list-msg { padding: 24px 20px; color: var(--muted); font-size: 16px; text-align: center; }
    .list-msg button {
      margin-top: 12px;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🎉<br>総会受付<br>フォーム</h1>

    <form id="f" novalidate>
      <span class="label-like first">会社名 <span class="req">*</span></span>
      <div class="select">
        <button type="button" id="companyBtn" class="field select-btn empty">タップして選択</button>
      </div>

      <label for="name">お名前（任意）</label>
      <input id="name" class="field" type="text" placeholder="山田 太郎" autocomplete="name">

      <label for="headcount">人数 <span class="req">*</span></label>
      <input id="headcount" class="field" type="number" inputmode="numeric" min="1" step="1" value="1">

      <div class="spacer"></div>
      <button id="submitBtn" class="submit" type="submit">✅ 送信</button>
    </form>

    <div id="error" class="error" role="alert" hidden></div>

    <div id="result" class="result" hidden>
      <div class="label">会社名</div>
      <div class="value" id="rCompany"></div>

      <div id="payment" class="payment" hidden>⚠️ 二次会費用を受付にてお支払いください</div>

      <div class="label">座席番号</div>
      <div class="seat" id="rSeat"></div>

      <div id="rUrlWrap" class="link" hidden>
        <a id="rUrl" href="#" target="_blank" rel="noopener">📍 座席表</a>
      </div>

      <div class="note">受付が完了しました。ご来場ありがとうございます！</div>
    </div>
  </div>

  <div id="picker" class="picker" role="dialog" aria-label="会社名を選択">
    <div class="picker-head">
      <span>会社名を選択</span>
      <button type="button" id="pickerClose" class="picker-close">閉じる</button>
    </div>
    <input id="search" class="field picker-search" type="search" placeholder="検索（任意）" autocomplete="off">
    <div id="list" class="picker-list"></div>
  </div>

  <script>
    // GASの「ウェブアプリのURL」（末尾が /exec のもの）
    const API_URL = 'https://script.google.com/macros/s/AKfycby0aHv5Csq7DEMKJW4okCqMoGthVP1w7q7KPymJ-UylOYaOyzNTaH5eOiyZJRdHI8OpUQ/exec';

    // ===== 要素 =====
    const $ = function(id) { return document.getElementById(id); };
    const form = $('f');
    const companyBtn = $('companyBtn');
    const submitBtn = $('submitBtn');
    const errorBox = $('error');
    const resultBox = $('result');
    const picker = $('picker');
    const search = $('search');
    const list = $('list');

    // ===== 状態 =====
    const rawPreset = (new URLSearchParams(location.search).get('c') || '').trim();
    let companies = [];
    let listState = 'loading';   // loading / ready / failed
    let selected = '';
    let sending = false;

    // ===== 通信（Googleのログイン情報は送らない＝来場者のアカウント状態に左右されない） =====
    function callApi(options, timeoutMs) {
      if (!/^https:\/\/script\.google\.com\//.test(API_URL)) {
        return Promise.reject(new Error('設定エラー：API_URL が未設定です。'));
      }
      const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      const timer = ctrl ? setTimeout(function() { ctrl.abort(); }, timeoutMs) : null;
      const url = options.query ? API_URL + '?' + options.query : API_URL;
      const init = { method: options.method || 'GET', credentials: 'omit', redirect: 'follow', cache: 'no-store' };
      if (options.body) init.body = JSON.stringify(options.body);   // text/plain で送る（事前確認の通信が発生しない）
      if (ctrl) init.signal = ctrl.signal;
      return fetch(url, init)
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .finally(function() { if (timer) clearTimeout(timer); });
    }

    // ===== 会社名 =====
    function setCompany(name) {
      selected = name || '';
      companyBtn.textContent = selected || 'タップして選択';
      companyBtn.classList.toggle('empty', !selected);
    }

    // QRの会社名はすぐ表示（一覧の読み込みを待たない。正式名はサーバー側でも照合する）
    if (rawPreset) setCompany(rawPreset);

    function loadInit(attempt) {
      listState = 'loading';
      renderList();
      // ※ GASでは「c」はGoogleの予約語でエラーになるため、会社名は送らずこちらで照合する
      callApi({ query: 'api=init' }, 20000)
        .then(function(data) {
          if (!data || !data.ok) throw new Error((data && data.error) || '読み込みエラー');
          companies = data.companies || [];
          listState = 'ready';
          renderList();
          if (rawPreset && selected === rawPreset) {
            const hit = findCompany(rawPreset);
            if (hit) {
              setCompany(hit);
            } else if (companies.length) {
              setCompany('');
              showError('QRコードの会社名が一覧に見つかりませんでした。「会社名」から選択してください。');
            }
          }
        })
        .catch(function(err) {
          if (attempt < 2 && !/設定エラー/.test(err.message)) {
            setTimeout(function() { loadInit(attempt + 1); }, 1500 * (attempt + 1));
            return;
          }
          listState = 'failed';
          renderList();
          if (/設定エラー/.test(err.message)) showError(err.message);
        });
    }

    // 全角/半角・空白の違いを無視して一致する会社名を探す
    function normalize(s) {
      return String(s || '').normalize('NFKC').replace(/\s+/g, '');
    }
    function findCompany(name) {
      if (companies.indexOf(name) !== -1) return name;
      const key = normalize(name);
      for (let i = 0; i < companies.length; i++) {
        if (normalize(companies[i]) === key) return companies[i];
      }
      return '';
    }

    function renderList() {
      list.textContent = '';
      if (listState !== 'ready') {
        const msg = document.createElement('div');
        msg.className = 'list-msg';
        msg.textContent = listState === 'loading' ? '読み込み中…' : '会社一覧を読み込めませんでした。';
        if (listState === 'failed') {
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.textContent = 'もう一度読み込む';
          retry.addEventListener('click', function() { loadInit(0); });
          msg.appendChild(document.createElement('br'));
          msg.appendChild(retry);
        }
        list.appendChild(msg);
        return;
      }
      const q = search.value.trim().toLowerCase();
      const shown = q ? companies.filter(function(c) { return c.toLowerCase().indexOf(q) !== -1; }) : companies;
      if (!shown.length) {
        const none = document.createElement('div');
        none.className = 'list-msg';
        none.textContent = '該当なし';
        list.appendChild(none);
        return;
      }
      const frag = document.createDocumentFragment();
      shown.forEach(function(c) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'item';
        b.textContent = c;
        frag.appendChild(b);
      });
      list.appendChild(frag);
    }

    list.addEventListener('click', function(e) {
      const item = e.target.closest('.item');
      if (!item) return;
      setCompany(item.textContent);
      hideError();
      closePicker();
    });

    function openPicker() {
      search.value = '';
      renderList();
      picker.classList.add('show');
      list.scrollTop = 0;
    }
    function closePicker() {
      search.blur();
      picker.classList.remove('show');
    }
    companyBtn.addEventListener('click', openPicker);
    $('pickerClose').addEventListener('click', closePicker);
    search.addEventListener('input', renderList);

    // ===== 送信 =====
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      if (sending) return;
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      hideError();

      if (!selected) {
        showError('会社名を選択してください。');
        return;
      }

      sending = true;
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ 送信中';

      callApi({
        method: 'POST',
        body: { company: selected, name: $('name').value, headcount: $('headcount').value }
      }, 30000)
        .then(function(res) {
          if (!res || !res.ok) throw new Error((res && res.error) || '登録に失敗しました。');
          showResult(res);
        })
        .catch(function(err) {
          let msg = err && err.message ? err.message : '';
          if (err && err.name === 'AbortError') {
            msg = '通信に時間がかかっています。電波の良い場所で、もう一度「送信」を押してください。';
          } else if (!msg || /Failed to fetch|Load failed|NetworkError|HTTP \d|JSON|Unexpected/i.test(msg)) {
            msg = '通信エラーが発生しました。電波の良い場所で、もう一度「送信」を押してください。';
          }
          showError(msg);
        })
        .finally(function() {
          sending = false;
          submitBtn.disabled = false;
          submitBtn.textContent = '✅ 送信';
        });
    });

    // ===== 結果・エラー表示 =====
    function showResult(res) {
      $('rCompany').textContent = res.company;

      const seat = $('rSeat');
      seat.textContent = '';
      String(res.seatNumber || '').split(',').map(function(s) { return s.trim(); }).filter(Boolean)
        .forEach(function(s, i) {
          if (i) seat.appendChild(document.createElement('br'));
          seat.appendChild(document.createTextNode(s));
        });

      $('payment').hidden = !res.showPaymentNotice;

      if (res.seatURL && /^https?:\/\//.test(res.seatURL)) {
        $('rUrl').href = res.seatURL;
        $('rUrlWrap').hidden = false;
      } else {
        $('rUrlWrap').hidden = true;
      }

      form.hidden = true;
      form.style.display = 'none';
      resultBox.hidden = false;
      window.scrollTo(0, 0);
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.hidden = false;
      setTimeout(function() { errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
    }
    function hideError() {
      errorBox.hidden = true;
    }

    loadInit(0);
  </script>
</body>
</html>
